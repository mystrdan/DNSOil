name: DNSOil CI

concurrency:
  group: dnsoil-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://dnsoil:dnsoil@localhost:5432/dnsoil_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnsoil
          POSTGRES_PASSWORD: dnsoil
          POSTGRES_DB: dnsoil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnsoil -d dnsoil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck workspaces
        run: pnpm typecheck
      - name: Test API behavior
        run: pnpm --filter @dnsoil/api test
      - name: Apply PostgreSQL migrations
        run: pnpm --filter @dnsoil/api migrate
      - name: Verify migration repeatability
        run: pnpm --filter @dnsoil/api migrate
      - name: Test hosting provider sync and ownership
        run: pnpm --filter @dnsoil/api test:hosting
      - name: Test provider catalogue and 1% fee calculation
        run: pnpm --filter @dnsoil/api test:catalog
      - name: Test wallet ledger constraints
        run: pnpm --filter @dnsoil/api test:wallet-ledger
      - name: Build workspaces
        run: pnpm build
