services:
  postgres:
    image: postgres:17-alpine
    container_name: dnsoil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnsoil
      POSTGRES_USER: dnsoil
      POSTGRES_PASSWORD: dnsoil
    ports:
      - "5432:5432"
    volumes:
      - dnsoil-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnsoil -d dnsoil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dnsoil-postgres-data:
